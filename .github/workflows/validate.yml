name: Validate atlas

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm run check
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m unittest discover -s tests
      - run: python scripts/fetch_catalog_inputs.py --help
      - run: python scripts/build_fault_catalog.py --help
